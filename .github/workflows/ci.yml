name: CI

on:
  push:
    branches: [main, 'robert/**']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: mysql://autotraq:autotraq123@127.0.0.1:3306/autotraq
      JWT_SECRET: test-only-secret
      FRONTEND_URL: http://localhost:5173

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: autotraq
          MYSQL_USER: autotraq
          MYSQL_PASSWORD: autotraq123
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u autotraq --password=autotraq123"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install root deps
        run: npm ci

      - name: Install backend deps
        run: npm ci --prefix backend

      - name: Install frontend deps
        run: npm ci --prefix frontend

      - name: Apply database schema
        run: npx prisma db push --schema backend/prisma/schema.prisma

      - name: Backend tests
        run: npm test --prefix backend

      - name: Frontend build
        run: npm run build --prefix frontend
